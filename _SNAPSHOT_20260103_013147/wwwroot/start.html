<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تشغيل النظام</title>
  <style>
    body{margin:0;background:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2937}
    .box{max-width:720px;margin:70px auto;padding:18px}
    .card{background:#fff;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.08);padding:18px}
    .muted{color:#6b7280;line-height:1.8}
    .bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:14px}
    .bar > div{height:100%;width:30%;background:#2563eb;animation:move 1.2s infinite}
    @keyframes move{0%{transform:translateX(0)}100%{transform:translateX(220%)}}
    code{background:#f3f4f6;padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <div class="box">
    <div class="card">
      <h2 style="margin:0 0 8px">جاري تجهيز النظام…</h2>
      <div class="muted">
        نتحقق من الاشتراك وإعدادات أول تشغيل.
        <br/>إذا طولنا… مو لأننا نتدلّع، غالبًا الإنترنت 😄
      </div>
      <div class="bar"><div></div></div>
      <div class="muted" id="msg" style="margin-top:12px"></div>
    </div>
  </div>

<script>
  function getDeviceId(){
    let id = localStorage.getItem("DEVICE_ID");
    if(!id){
      id = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
           ("DEV-" + Math.random().toString(16).slice(2) + "-" + Date.now());
      localStorage.setItem("DEVICE_ID", id);
    }
    return id;
  }

  async function jget(url){
    const r = await fetch(url, {cache:"no-store"});
    const txt = await r.text();
    let data=null; try{ data = txt? JSON.parse(txt): null; }catch{ data={raw:txt}; }
    if(!r.ok) throw new Error(r.status + " " + (data?.detail || data?.message || data?.raw || txt || ""));
    return data;
  }

  async function go(){
    const msg = document.getElementById("msg");
    const deviceId = getDeviceId();
    msg.innerHTML = "DeviceId: <code>"+deviceId+"</code>";

    // 1) الاشتراك
    const st = await jget("/api/subscription/status?deviceId="+encodeURIComponent(deviceId));

    if(!st || !st.ok){
      location.href="/subscription.html";
      return;
    }

    // محظور / منتهي / لا اشتراك
    const blocked = !!st.isBlocked;
    const active  = !!st.isActive;

    if(blocked || !active){
      location.href="/subscription.html";
      return;
    }

    // 2) أول تشغيل: هل يوجد موظفين؟
    const emp = await jget("/api/employees/any");
    if(emp && emp.ok && emp.hasEmployees === false){
      location.href="/employees.html"; // شاشة إنشاء المدير
      return;
    }

    // 3) طبيعي: صفحة الدخول عندك (غيّرها لو اسمها مختلف)
    location.href="/login.html";
  }

  go().catch(err=>{
    document.getElementById("msg").innerText = "تعذر التحقق: " + err.message;
    // fallback
    setTimeout(()=> location.href="/subscription.html", 1200);
  });
</script>
</body>
</html>
