<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>لوحة التحكم - دخول</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--b:#e2e8f0;--pri:#2563eb}
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#dbeafe,transparent),var(--bg);color:var(--txt)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:var(--card);border:1px solid var(--b);border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);padding:18px}
.h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.badge{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px}
h1{margin:0;font-size:18px}
p{margin:6px 0 0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;margin-top:14px}
label{font-size:12px;color:var(--mut);font-weight:800}
input{width:100%;padding:12px 12px;border:1px solid var(--b);border-radius:12px;font-size:14px;outline:none;background:#fff}
input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(147,197,253,.35)}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #1d4ed8;background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;font-weight:900;cursor:pointer}
.msg{margin-top:10px;font-size:13px}
.err{color:#b91c1c}
.ok{color:#15803d}
.small{margin-top:12px;color:var(--mut);font-size:12px}
a{color:#1d4ed8;text-decoration:none;font-weight:800}
</style></head><body>
<div class="wrap">
  <div class="card">
    <div class="h">
      <div>
        <h1>لوحة التحكم (Super Admin)</h1>
        <p>هذه لوحة خاصة بك لإدارة المشتركين والخطط.</p>
      </div>
      <div class="badge">CONTROL PANEL</div>
    </div>

    <div class="grid">
      <div>
        <label>اسم المستخدم</label>
        <input id="u" autocomplete="username" placeholder="superadmin"/>
      </div>
      <div>
        <label>كلمة المرور</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <button class="btn" id="loginBtn">دخول</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="small">
      أول مرة؟ افتح هذا الرابط مرة واحدة لإنشاء المدير والخطط:
      <a href="#" id="bootstrap">تهيئة النظام</a>
    </div>
  </div>
</div>

<script>
const api = async (url, opt={})=>{
  const r = await fetch(url, { headers:{ "Content-Type":"application/json", ...(opt.headers||{}) }, ...opt });
  const txt = await r.text();
  let data=null; try{ data=txt?JSON.parse(txt):null }catch{ data=txt }
  if(!r.ok) throw data||("HTTP "+r.status);
  return data;
};

const msg = (t, ok=false)=>{
  const el=document.getElementById('msg');
  el.className = "msg " + (ok?"ok":"err");
  el.textContent = t || "";
};

document.getElementById('bootstrap').onclick = async (e)=>{
  e.preventDefault();
  msg("جاري التهيئة...");
  try{
    const d = await api("/api/cp/bootstrap", { method:"POST", body:"{}" });
    if(d && d.created){
      msg("تم إنشاء superadmin. كلمة المرور المؤقتة: " + d.tempPassword + " (غيّرها بعد الدخول)", true);
      document.getElementById('u').value = d.username;
      document.getElementById('p').value = d.tempPassword;
    }else{
      msg("النظام مهيأ مسبقاً ✅", true);
    }
  }catch(err){
    msg("فشل التهيئة: " + (err?.detail || err));
  }
};

document.getElementById('loginBtn').onclick = async ()=>{
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  msg("جاري تسجيل الدخول...");
  try{
    const d = await api("/api/cp/login", { method:"POST", body: JSON.stringify({username:u,password:p}) });
    localStorage.setItem("cp_token", d.token);
    location.href="/cp/tenants.html";
  }catch(err){
    msg("بيانات الدخول غير صحيحة أو غير مفعّل.");
  }
};
</script>
</body></html>
